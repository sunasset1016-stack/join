<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>1% 연구소 브리핑 채널 입장</title>
<style>
  :root {
    --bg: #070d1c;
    --card: #0f1830;
    --line: #1f2c4d;
    --text: #eef3ff;
    --sub: #9aa8c7;
    --accent: #3ddc97;
    --accent-ink: #04130c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #10204a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Roboto, sans-serif;
    padding: 20px 18px calc(28px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  main { width: 100%; max-width: 420px; margin: 0 auto; text-align: center; }

  /* 오른쪽 위 ⋯ 를 가리키는 화살표 */
  .pointer {
    display: none;
    justify-content: flex-end; align-items: center; gap: 8px;
    margin: 0 2px 18px 0;
    color: var(--accent); font-weight: 800; font-size: 16px;
  }
  .pointer .arrow {
    font-size: 30px; line-height: 1;
    animation: nudge 1s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(4px, -6px); }
  }
  @media (prefers-reduced-motion: reduce) { .pointer .arrow { animation: none; } }

  .badge {
    width: 76px; height: 76px; margin: 0 auto 14px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; color: var(--accent);
    box-shadow: 0 0 26px rgba(61, 220, 151, .35);
    background: #081226;
  }
  h1 { font-size: 21px; line-height: 1.35; margin: 0 0 6px; word-break: keep-all; }
  .desc { color: var(--sub); font-size: 14.5px; line-height: 1.6; margin: 0 0 20px; word-break: keep-all; }

  .steps {
    display: none;
    background: var(--card); border: 1.5px solid var(--accent); border-radius: 16px;
    padding: 18px 16px 8px; text-align: left; margin-bottom: 14px;
  }
  .steps h2 { margin: 0 0 14px; font-size: 16.5px; text-align: center; word-break: keep-all; }
  .step { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 16.5px; line-height: 1.4; word-break: keep-all; }
  .num {
    flex: 0 0 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
  }
  .step b { color: var(--accent); }

  .btn {
    display: block; width: 100%;
    padding: 16px;
    border-radius: 14px;
    font-size: 16.5px; font-weight: 700;
    text-decoration: none;
    border: 0; cursor: pointer;
    font-family: inherit;
  }
  .primary { display: none; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(61, 220, 151, .28); margin-bottom: 10px; }
  .ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); font-size: 15.5px; font-weight: 600; }
  .hint { display: none; color: var(--sub); font-size: 13.5px; line-height: 1.6; margin: 10px 0 0; word-break: keep-all; }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: #fff; color: #111; font-size: 14px; font-weight: 600;
    padding: 11px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <div id="pointer" class="pointer"><span>먼저 여기 ⋯ 를 누르세요</span><span class="arrow">↗</span></div>

  <div class="badge">1%</div>
  <h1>1% 연구소 브리핑 채널</h1>
  <p class="desc">장 마감 후 정기 분석 브리핑을 텔레그램에서 받아보세요.</p>

  <div id="steps" class="steps">
    <h2>입장 방법 (10초)</h2>
    <div class="step"><span class="num">1</span><span>화면 오른쪽 위 <b>⋯</b> 누르기</span></div>
    <div class="step"><span class="num">2</span><span><b>브라우저에서 열기</b> 누르기</span></div>
    <div class="step"><span class="num">3</span><span>텔레그램 입장 화면이 자동으로 열립니다</span></div>
  </div>

  <a id="open" class="btn primary" href="#">텔레그램에서 입장하기</a>
  <button id="copy" class="btn ghost" type="button">초대 링크 복사</button>
  <p id="hint" class="hint">복사한 링크를 Chrome이나 텔레그램에 붙여넣어도 입장할 수 있어요.</p>
</main>
<div id="toast" class="toast">링크를 복사했어요</div>

<script>
(function () {
  // ▼▼▼ 여기 한 줄만 본인 초대 링크로 맞추면 됩니다 (t.me/+ 뒤의 글자) ▼▼▼
  var INVITE = "pt7nrmwYHKhiMTVl";
  // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

  var webUrl = "https://t.me/+" + INVITE;

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isMobile = isAndroid || isIOS;
  var inApp = /musical_ly|BytedanceWebview|ByteLocale|TikTok|trill|Instagram|FBAN|FBAV|KAKAOTALK|NAVER|Line\//i.test(ua);

  var openBtn = document.getElementById("open");
  var copyBtn = document.getElementById("copy");
  var toast = document.getElementById("toast");

  function show(id, mode) { document.getElementById(id).style.display = mode || "block"; }

  if (isMobile && !inApp) {
    // Chrome·Safari 등 일반 브라우저: 텔레그램 초대 화면으로 바로 이동
    location.replace(webUrl);
    return;
  }

  if (isMobile && inApp) {
    // 틱톡 등 앱 안: 앱 호출이 막혀 있으므로 ⋯ → 브라우저에서 열기 안내를 크게 보여줌
    show("pointer", "flex");
    show("steps");
    show("hint");
    if (isIOS) {
      // 아이폰은 Safari로 넘기는 버튼을 추가로 제공
      openBtn.textContent = "Safari로 열기";
      openBtn.href = "x-safari-https://t.me/+" + INVITE;
      show("open");
    }
  } else {
    // PC
    openBtn.href = webUrl;
    show("open");
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.className = "toast show";
    setTimeout(function () { toast.className = "toast"; }, 1800);
  }

  copyBtn.addEventListener("click", function () {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = webUrl;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, 999);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      showToast(ok ? "링크를 복사했어요" : "복사가 안 되면 ⋯ 메뉴를 이용해 주세요");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(webUrl).then(function () {
        showToast("링크를 복사했어요");
      }, fallback);
    } else {
      fallback();
    }
  });
})();
</script>
</body>
</html>
