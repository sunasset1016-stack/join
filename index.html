<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>1% 연구소 브리핑 채널 입장</title>
<style>
  :root {
    --bg: #070d1c;
    --card: #0f1830;
    --line: #1f2c4d;
    --text: #eef3ff;
    --sub: #9aa8c7;
    --accent: #3ddc97;
    --accent-ink: #04130c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #10204a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .badge {
    width: 88px; height: 88px; margin: 0 auto 18px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: var(--accent);
    box-shadow: 0 0 28px rgba(61, 220, 151, .35);
    background: #081226;
  }
  h1 { font-size: 22px; line-height: 1.35; margin: 0 0 8px; word-break: keep-all; }
  .desc { color: var(--sub); font-size: 14.5px; line-height: 1.6; margin: 0 0 24px; word-break: keep-all; }
  .btn {
    display: block; width: 100%;
    padding: 17px 16px;
    border-radius: 14px;
    font-size: 17px; font-weight: 700;
    text-decoration: none;
    border: 0; cursor: pointer;
    font-family: inherit;
  }
  .primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(61, 220, 151, .28); }
  .primary:active { transform: translateY(1px); }
  .ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); margin-top: 10px; font-size: 15.5px; font-weight: 600; }
  .help {
    margin-top: 22px; padding: 16px 16px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    text-align: left;
  }
  .help.on { border-color: var(--accent); }
  .help h2 { font-size: 14.5px; margin: 0 0 10px; color: var(--accent); }
  .help ol { margin: 0; padding-left: 20px; color: var(--text); font-size: 14.5px; line-height: 1.75; }
  .help b { color: var(--accent); }
  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: #fff; color: #111; font-size: 14px; font-weight: 600;
    padding: 11px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <div class="badge">1%</div>
  <h1>1% 연구소 브리핑 채널</h1>
  <p class="desc">장 마감 후 정기 분석 브리핑을 텔레그램에서 받아보세요.<br>아래 버튼을 누르면 텔레그램으로 연결됩니다.</p>

  <a id="open" class="btn primary" href="#">텔레그램에서 입장하기</a>
  <a id="browser" class="btn ghost" href="#">안 열리면 여기 (브라우저로 열기)</a>
  <button id="copy" class="btn ghost" type="button">초대 링크 복사</button>

  <div id="help" class="help">
    <h2>버튼을 눌러도 안 열리나요?</h2>
    <ol>
      <li>화면 오른쪽 위 <b>⋯</b> 를 누르세요</li>
      <li><b>브라우저에서 열기</b>를 누르세요</li>
      <li>열린 화면에서 다시 <b>입장하기</b>를 누르세요</li>
    </ol>
  </div>
</main>
<div id="toast" class="toast">링크를 복사했어요</div>

<script>
(function () {
  // ▼▼▼ 여기 한 줄만 본인 초대 링크로 맞추면 됩니다 (t.me/+ 뒤의 글자) ▼▼▼
  var INVITE = "pt7nrmwYHKhiMTVl";
  // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

  var webUrl = "https://t.me/+" + INVITE;
  var tgUrl = "tg://join?invite=" + INVITE;

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var inApp = /musical_ly|BytedanceWebview|ByteLocale|TikTok|trill|Instagram|FBAN|FBAV|KAKAOTALK|NAVER|Line\//i.test(ua);

  var openBtn = document.getElementById("open");
  var browserBtn = document.getElementById("browser");
  var copyBtn = document.getElementById("copy");
  var help = document.getElementById("help");
  var toast = document.getElementById("toast");

  var appLink, browserLink;
  if (isAndroid) {
    // 텔레그램 앱을 직접 호출. 앱이 없으면 t.me 웹페이지로 넘어감
    appLink = "intent://join?invite=" + INVITE +
      "#Intent;scheme=tg;package=org.telegram.messenger;" +
      "S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";
    // 안드로이드에 링크를 넘겨 기본 앱(텔레그램 또는 브라우저)으로 열기
    browserLink = "intent://t.me/+" + INVITE +
      "#Intent;scheme=https;action=android.intent.action.VIEW;" +
      "S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";
  } else if (isIOS) {
    appLink = tgUrl;
    browserLink = "x-safari-https://t.me/+" + INVITE; // Safari로 넘기기
  } else {
    appLink = webUrl;
    browserLink = webUrl;
  }

  openBtn.href = appLink;
  browserBtn.href = browserLink;

  // 일반 브라우저(Chrome/Safari)로 들어온 경우엔 바로 텔레그램 페이지로 이동
  if (!inApp && (isAndroid || isIOS)) {
    location.replace(webUrl);
    return;
  }

  // 버튼을 눌렀는데도 화면이 그대로면 안내를 강조
  function watch() {
    setTimeout(function () {
      if (!document.hidden) help.className = "help on";
    }, 1800);
  }
  openBtn.addEventListener("click", watch);
  browserBtn.addEventListener("click", watch);

  function showToast(msg) {
    toast.textContent = msg;
    toast.className = "toast show";
    setTimeout(function () { toast.className = "toast"; }, 1800);
  }

  copyBtn.addEventListener("click", function () {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = webUrl;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, 999);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      showToast(ok ? "링크를 복사했어요" : "복사가 안 되면 ⋯ 메뉴를 이용해 주세요");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(webUrl).then(function () {
        showToast("링크를 복사했어요");
      }, fallback);
    } else {
      fallback();
    }
  });
})();
</script>
</body>
</html>
